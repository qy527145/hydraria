[package]
name = "hydraria"
version = "0.2.0"
edition = "2024"
description = "High-performance multi-threaded HTTP streaming proxy with web dashboard"
license = "Apache-2.0"
authors = ["wmymz"]
repository = "https://github.com/qy527145/hydraria"
# The dashboard is embedded from web/dist, which is committed so that
# `cargo install` (crates.io or --git) never needs node/npm. After changing
# anything under web/src, run `npm run build` in web/ and commit web/dist.
include = [
    "/src/**",
    "/build.rs",
    "/web/dist/**",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
    "/docs/**",
]

[package.metadata.wix]
upgrade-guid = "6C6688C5-58D4-4F06-BA74-98D129AD95FC"
path-guid = "304E1F44-EE75-4EF8-BD12-ABF2FF88678D"
license = false
eula = false

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
# `http2` is deliberately absent from this feature list. reqwest's defaults are
# ["default-tls", "charset", "http2", "system-proxy"]; everything except http2 is
# re-listed here. When h2 is negotiated over ALPN, hyper's pool hands out a
# *shared* connection reservation, so all `max_threads` concurrent chunk
# requests to one host multiplex onto a single TCP connection — one congestion
# window, and one instance of whatever per-connection rate limit the origin
# applies. That collapses N-way parallelism back to 1×, which is this project's
# entire reason to exist. `engine::build_upstream_client` also calls
# `.http1_only()`, so the guard survives someone re-adding the feature here.
reqwest = { version = "0.13.3", default-features = false, features = [
    "default-tls",
    "charset",
    "system-proxy",
    "json",
    "stream",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"
uuid = { version = "1.10", features = ["v4"] }
bytes = "1.7"
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
async-stream = "0.3"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
chacha20 = "0.9"
rand = "0.8"
base64 = "0.22"
httpdate = "1.0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
